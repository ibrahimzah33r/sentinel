services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: ${SENTINEL_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${SENTINEL_DATABASE_PASSWORD}
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/ibrahimzah33r/sentinel-backend:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SENTINEL_DATABASE_URL: jdbc:postgresql://postgres:5432/sentinel
      SENTINEL_DATABASE_USERNAME: ${SENTINEL_DATABASE_USERNAME}
      SENTINEL_DATABASE_PASSWORD: ${SENTINEL_DATABASE_PASSWORD}
      SENTINEL_FRONTEND_ORIGIN: ${SENTINEL_FRONTEND_ORIGIN}
      SENTINEL_ANALYST_USERNAME: ${SENTINEL_ANALYST_USERNAME}
      SENTINEL_ANALYST_PASSWORD: ${SENTINEL_ANALYST_PASSWORD}
      SENTINEL_SESSION_COOKIE_SECURE: ${SENTINEL_SESSION_COOKIE_SECURE:-true}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:8080/actuator/health | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 7
      start_period: 30s
  frontend:
    image: ghcr.io/ibrahimzah33r/sentinel-web:latest
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sentinel_postgres_data:
