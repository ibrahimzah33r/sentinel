spring.datasource.url=${SENTINEL_DATABASE_URL}
spring.datasource.username=${SENTINEL_DATABASE_USERNAME}
spring.datasource.password=${SENTINEL_DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate


server.servlet.session.cookie.secure=${SENTINEL_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

server.forward-headers-strategy=framework
sentinel.frontend.origin=${SENTINEL_FRONTEND_ORIGIN}